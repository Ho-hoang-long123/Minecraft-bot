name: Aternos Bedrock AFK Bot (Infinite)

on:
  workflow_dispatch:
    inputs:
      server_host:
        description: 'Nhập Host hoặc DynIP Bedrock'
        required: true
        default: 'drum.aternos.host'
      server_port:
        description: 'Nhập Port Bedrock (Cổng riêng trên Aternos)'
        required: true
        default: '19132'
  schedule:
    # Tự động chạy lại cứ sau mỗi 5 tiếng để chống ngắt quãng 6 tiếng của GitHub
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cài đặt thư viện bedrock-protocol
        run: npm install

      - name: Chạy Bot Bedrock Vô Hạn (Anti Crash)
        env:
          SERVER_HOST: ${{ github.event.inputs.server_host || 'drum.aternos.host' }}
          SERVER_PORT: ${{ github.event.inputs.server_port || '19132' }}
        run: |
          while true; do
            echo "[*] Đang khởi động tiến trình Bot Bedrock nhinmegi..."
            node bot.js || echo "[!] Bot ngắt kết nối, khởi động lại sau 5s..."
            sleep 5
          done
          
