name: Aternos Java AFK Bot (Auto 24/7)

on:
  workflow_dispatch:
    inputs:
      server_host:
        description: 'Host Java'
        required: false
        default: 'dottyback.aternos.host'
      server_port:
        description: 'Port Java'
        required: false
        default: '11391'
      server_version:
        description: 'Phiên bản Minecraft'
        required: false
        default: '1.21.11'

permissions:
  actions: write
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # --- CACHE NPM GIÚP CÀI ĐẶT SIÊU TỐC ---
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      # --------------------------------------

      - name: Cài đặt thư viện
        run: npm ci || npm install mineflayer --prefer-offline

      - name: Chạy Bot & Đợi 5 tiếng gọi Workflow tiếp theo
        env:
          SERVER_HOST: ${{ github.event.inputs.server_host || 'dottyback.aternos.host' }}
          SERVER_PORT: ${{ github.event.inputs.server_port || '11391' }}
          SERVER_VERSION: ${{ github.event.inputs.server_version || '1.21.11' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # 1. Chạy Bot ngầm ở background
          echo "[*] Khởi tạo tiến trình Bot kết nối tới $SERVER_HOST:$SERVER_PORT (v$SERVER_VERSION)..."
          node bot.js &
          BOT_PID=$!

          # 2. Ngủ 5 tiếng (18000 giây)
          echo "[*] Bot đã chạy. Đang đếm ngược 5 tiếng (18000s) để kích hoạt Workflow tiếp theo..."
          sleep 18000

          # 3. Sau 5 tiếng, gọi Workflow mới để nối chuỗi chạy tiếp
          echo "[+] Đã đủ 5 tiếng! Đang truyền thông tin server và gọi Workflow kế tiếp..."
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/actions/workflows/afk.yml/dispatches \
            -d "{
              \"ref\": \"main\",
              \"inputs\": {
                \"server_host\": \"$SERVER_HOST\",
                \"server_port\": \"$SERVER_PORT\",
                \"server_version\": \"$SERVER_VERSION\"
              }
            }" || echo "[!] Lỗi khi gọi Workflow mới!"

          # 4. Chạy gối đầu nốt 1 tiếng cuối cùng (3600 giây)
          echo "[*] Workflow tiếp theo đã được tạo. Workflow hiện tại sẽ chạy nốt 1 tiếng còn lại..."
          sleep 3600
          
          # Tắt bot cũ
          kill $BOT_PID || true
          
