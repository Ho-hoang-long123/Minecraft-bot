name: Aternos Bedrock AFK Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm' # Tự động lưu cache npm, lần sau chạy sẽ không phải tải lại

      - name: Install Dependencies
        run: npm install --prefer-offline --no-audit

      - name: Run Bot
        run: node bot.js
        
