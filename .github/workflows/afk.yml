name: Aternos Java AFK Bot (Infinite)

on:
  workflow_dispatch:
    inputs:
      server_host:
        description: 'Nhập Host hoặc DynIP Java (VD: kokopu.aternos.host)'
        required: true
        default: 'kokopu.aternos.host'
      server_port:
        description: 'Nhập Port Java (5 chữ số trên Aternos)'
        required: true
        default: '11391'
  schedule:
    # Tự động chạy lại cứ sau mỗi 5 tiếng để chống ngắt quãng 6 tiếng của GitHub
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cài đặt thư viện Mineflayer
        run: npm install

      - name: Chạy Bot Java Vô Hạn (nhinmegi)
        env:
          SERVER_HOST: ${{ github.event.inputs.server_host || 'kokopu.aternos.host' }}
          SERVER_PORT: ${{ github.event.inputs.server_port || '11391' }}
        run: |
          while true; do
            echo "[*] Đang khởi động tiến trình Bot Java nhinmegi..."
            node bot.js || echo "[!] Bot ngắt kết nối, khởi động lại sau 5s..."
            sleep 5
          done
          
