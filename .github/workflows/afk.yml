name: Aternos Java AFK Bot (Infinite 24/7)

on:
  workflow_dispatch:
    inputs:
      server_host:
        description: 'Nhập Host hoặc DynIP Java'
        required: true
        default: 'hawkfish.aternos.host'
      server_port:
        description: 'Nhập Port Java'
        required: true
        default: '11391'
      server_version:
        description: 'Nhập phiên bản Minecraft'
        required: true
        default: '1.21'
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cài đặt thư viện
        run: npm install

      - name: Chạy Bot Vô Hạn (Anti-Crash)
        env:
          SERVER_HOST: ${{ github.event.inputs.server_host || 'hawkfish.aternos.host' }}
          SERVER_PORT: ${{ github.event.inputs.server_port || '11391' }}
          SERVER_VERSION: ${{ github.event.inputs.server_version || '1.21' }}
        run: |
          while true; do
            echo "[*] Đang khởi động tiến trình Bot..."
            node bot.js || echo "[!] Bot bị ngắt kết nối, đang khởi động lại sau 5 giây..."
            sleep 5
          done
