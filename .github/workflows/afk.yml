name: Aternos DynIP Bot

on:
  workflow_dispatch:
    inputs:
      server_port:
        description: 'Nhập Port mới của DynIP (Ví dụ: 12345)'
        required: true
        default: '19132'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install --package-lock-only || true
          npm install

      - name: Run Bot
        env:
          SERVER_PORT: ${{ github.event.inputs.server_port }}
        run: node bot.js
        
