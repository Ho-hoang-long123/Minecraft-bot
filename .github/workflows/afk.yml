name: Aternos Java AFK Bot (Gối Đầu 24/7)

on:
  workflow_dispatch:
    inputs:
      server_host:
        description: 'Host Java'
        required: true
        default: 'hawkfish.aternos.host'
      server_port:
        description: 'Port Java'
        required: true
        default: '11391'
      server_version:
        description: 'Phiên bản Minecraft'
        required: true
        default: '1.21'
  schedule:
    # Tự động gọi ca mới sau mỗi 5 tiếng (gối đầu 1 tiếng với ca cũ 6 tiếng)
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cài đặt thư viện
        run: npm install

      - name: Chạy Bot Vô Hạn (Tự chờ Server Bật)
        env:
          SERVER_HOST: ${{ github.event.inputs.server_host || 'hawkfish.aternos.host' }}
          SERVER_PORT: ${{ github.event.inputs.server_port || '11391' }}
          SERVER_VERSION: ${{ github.event.inputs.server_version || '1.21' }}
        run: |
          while true; do
            echo "[*] Đang khởi chạy tiến trình Bot..."
            node bot.js || echo "[!] Ngắt kết nối hoặc Server chưa xong, thử lại sau 10s..."
            sleep 10
          done
          
