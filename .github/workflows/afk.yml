name: Aternos Java AFK Bot (Infinite)

on:
  workflow_dispatch:
    inputs:
      server_host:
        description: 'Nhập Host hoặc DynIP Java (VD: server.aternos.host)'
        required: true
        default: 'Heopeppa.aternos.me'
      server_port:
        description: 'Nhập Port Java (VD: 25565 hoặc cổng DynIP)'
        required: true
        default: '25565'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cài đặt thư viện Mineflayer
        run: npm install

      - name: Chạy Bot Vô Hạn (Không bao giờ Complete)
        env:
          SERVER_HOST: ${{ github.event.inputs.server_host }}
          SERVER_PORT: ${{ github.event.inputs.server_port }}
        run: |
          while true; do
            echo "[*] Đang khởi động bot..."
            node bot.js || echo "[!] Bot vừa gặp lỗi, tự động khởi động lại sau 5 giây..."
            sleep 5
          done
          
